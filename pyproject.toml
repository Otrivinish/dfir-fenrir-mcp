[project]
name = "fenrir-mcp"
version = "0.1.4"
description = "MCP server exposing DFIR-FENRIR v2 to Claude Code over stdio"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "mcp>=2,<3",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
fenrir-mcp = "fenrir_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fenrir_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
